[package]
name = "homework-system-desktop"
version = "2.0.0"
description = "班级作业查询系统桌面端"
authors = ["HomeworkSystem"]
edition = "2021"

[lib]
name = "homework_system_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
